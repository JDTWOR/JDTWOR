<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Jhon Deivid Rojas — backend developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1017"/>
      <stop offset="100%" stop-color="#111A24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.1" cy="0" r="0.9">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#58A6FF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8B949E" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#58A6FF" fill-opacity="0.85"/>

  <text x="1118" y="196" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="150" font-weight="700" fill="#C9D1D9" fill-opacity="0.055"
        letter-spacing="-4">JR</text>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(64,74)">
      <rect x="0" y="-11" width="26" height="2" fill="#58A6FF"/>
      <text x="40" y="-5" font-size="13" font-weight="600" fill="#7D8B99" letter-spacing="3.6">BACKEND ENGINEER</text>
    </g>

    <text x="64" y="146" font-size="52" font-weight="700" fill="#F0F6FC" letter-spacing="-1.2">Jhon Deivid Rojas</text>

    <text x="64" y="188" font-size="19" font-weight="400" fill="#A7B4C2">Rust · Go · PostgreSQL — APIs, integrations and business automation</text>

    <g transform="translate(64,226)">
      <circle cx="4" cy="-5" r="4" fill="#3FB950"/>
      <text x="18" y="0" font-size="14" fill="#7D8B99" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Colombia · UTC-5 · open to remote work</text>
